<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crystal Focus - Mindful Wellness</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div class="app-container">
    <header class="app-header">
      <h1>Crystal Focus</h1>
      <p class="subtitle">Mindful Attention & Relaxation</p>
    </header>

    <nav class="mode-selector">
      <button class="nav-btn active" data-tab="breath">Pulse</button>
      <button class="nav-btn" data-tab="memory">Grid</button>
      <button class="nav-btn" data-tab="ambient">Chime</button>
    </nav>

    <main class="content-area">
      <!-- Mode 1: Mindful Pulse / Breathing -->
      <section id="breath-mode" class="mode-section active">
        <div class="glass-card">
          <div class="breathing-circle-wrapper">
            <div class="breathing-circle" id="breath-node"></div>
            <div class="breathing-glow"></div>
          </div>
          <p id="breath-instruction" class="instruction">Tap and Hold to Synchronize</p>
          <div class="stats-row">
            <span>Focus Score: <strong id="focus-score">0</strong></span>
          </div>
        </div>
      </section>

      <!-- Mode 2: Crystal Sequence Memory -->
      <section id="memory-mode" class="mode-section">
        <div class="glass-card">
          <p class="instruction" id="memory-status">Press Start to Begin Sequence</p>
          <div class="crystal-grid">
            <button class="crystal-btn" data-id="0" style="--glow-color: #7000ff;"></button>
            <button class="crystal-btn" data-id="1" style="--glow-color: #00f0ff;"></button>
            <button class="crystal-btn" data-id="2" style="--glow-color: #ff0077;"></button>
            <button class="crystal-btn" data-id="3" style="--glow-color: #00ffaa;"></button>
          </div>
          <button id="start-memory-btn" class="action-btn">Start Game</button>
        </div>
      </section>

      <!-- Mode 3: Ambient Resonance -->
      <section id="ambient-mode" class="mode-section">
        <div class="glass-card">
          <h3>Soundscape Generator</h3>
          <p class="instruction">Toggle ambient soundscapes for relaxation</p>
          <div class="ambient-controls">
            <button id="toggle-drone" class="ambient-btn">
              <span class="icon">✨</span> 432Hz Cosmic Sound
            </button>
            <button id="toggle-chimes" class="ambient-btn">
              <span class="icon">🎐</span> Wind Chimes
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>Argyria Midterm Project • Mobile-First Experience</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
