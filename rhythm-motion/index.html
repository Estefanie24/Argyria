<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rhythm of Motion</title>
  <style>
    :root {
      --bg: #0c1020;
      --mint: #9df5df;
      --lavender: #b9a8ff;
      --pink: #ffb7df;
      --panel: rgba(24, 30, 55, 0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      touch-action: manipulation;
    }
    #app-container { width: 100%; max-width: 500px; text-align: center; }
    h1 { margin-bottom: 5px; color: var(--mint); }
    p { color: #a8b0d2; font-size: 0.9rem; margin-bottom: 15px; }

    /* Overlay for audio/sensor permission unlock */
    #unlock-overlay {
      position: fixed; inset: 0; background: rgba(12, 16, 32, 0.95);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 100; padding: 20px; text-align: center;
    }
    .start-btn {
      background: linear-gradient(100deg, var(--mint), #c2f8ec);
      color: #11162b; border: 0; padding: 16px 32px; font-size: 1.1rem;
      font-weight: bold; border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(157, 245, 223, 0.4); margin-top: 15px;
    }

    /* Game Playfield */
    #playfield {
      position: relative; width: 100%; height: 350px;
      background: radial-gradient(circle at center, #171e38, #0c1020);
      border: 2px solid var(--lavender); border-radius: 20px;
      overflow: hidden; margin-bottom: 20px;
    }
    #player {
      position: absolute; left: 50%; top: 50%; width: 36px; height: 36px;
      border-radius: 50%; background: var(--mint);
      box-shadow: 0 0 20px var(--mint); transform: translate(-50%, -50%);
      transition: left 0.1s ease-out, top 0.1s ease-out;
    }
    #target {
      position: absolute; left: 75%; top: 30%; font-size: 2rem;
      transform: translate(-50%, -50%); color: var(--pink);
      text-shadow: 0 0 15px var(--pink);
    }

    /* Dashboard */
    .metrics { display: flex; justify-content: space-around; background: var(--panel); padding: 12px; border-radius: 12px; margin-bottom: 15px; }
    .metric-val { font-size: 1.4rem; font-weight: bold; color: var(--mint); }
    .sensor-info { background: var(--panel); padding: 12px; border-radius: 12px; font-size: 0.8rem; text-align: left; }
    .sensor-ok { color: var(--mint); font-weight: bold; }
  </style>
</head>
<body>

  <div id="unlock-overlay">
    <h1>🎵 Rhythm of Motion</h1>
    <p>Tap below to enable audio and phone motion sensors.</p>
    <button class="start-btn" id="unlock-btn">START GAME & AUDIO</button>
  </div>

  <div id="app-container">
    <h1>Rhythm of Motion</h1>
    <p>Tilt your phone to guide the light & hit the target!</p>

    <div id="playfield">
      <div id="target">✦</div>
      <div id="player"></div>
    </div>

    <div class="metrics">
      <div><div>Sparks</div><div class="metric-val" id="score">0</div></div>
      <div><div>Pulses</div><div class="metric-val" id="pulses">0</div></div>
    </div>

    <div class="sensor-info">
      <div>Orientation (Tilt): <span id="tilt-status">Waiting</span></div>
      <div>Accelerometer: <span id="accel-status">Waiting</span></div>
      <div>Tilt Reading: <span id="tilt-val">—</span></div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let score = 0, pulses = 0;
    let playerX = 50, playerY = 50;
    let targetX = 75, targetY = 30;
    let lastPulseAt = 0;

    const player = document.getElementById("player");
    const target = document.getElementById("target");
    const scoreEl = document.getElementById("score");
    const pulsesEl = document.getElementById("pulses");
    const tiltStatus = document.getElementById("tilt-status");
    const accelStatus = document.getElementById("accel-status");
    const tiltVal = document.getElementById("tilt-val");

    // Initialize Web Audio Context
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    // Play a synth chime using Web Audio API
    function playTone(freq, duration = 0.2) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Handle Phone Orientation (Tilt steering)
    function handleOrientation(e) {
      if (e.beta == null && e.gamma == null) return;
      tiltStatus.textContent = "Active";
      tiltStatus.className = "sensor-ok";
      
      let gamma = e.gamma || 0; // Left/Right (-90 to 90)
      let beta = e.beta || 0;   // Front/Back (-180 to 180)

      playerX = Math.max(8, Math.min(92, 50 + gamma * 1.2));
      playerY = Math.max(8, Math.min(92, 50 + (beta - 30) * 1.2));

      player.style.left = playerX + "%";
      player.style.top = playerY + "%";
      tiltVal.textContent = `${Math.round(beta)}° / ${Math.round(gamma)}°`;

      checkHit();
    }

    // Handle Accelerometer (Motion pulse)
    function handleMotion(e) {
      const acc = e.acceleration || e.accelerationIncludingGravity;
      if (!acc || acc.x == null) return;

      accelStatus.textContent = "Active";
      accelStatus.className = "sensor-ok";

      let magnitude = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      let now = Date.now();

      if (magnitude > 15 && now - lastPulseAt > 1000) {
        lastPulseAt = now;
        pulses++;
        pulsesEl.textContent = pulses;
        playTone(300, 0.3); // Low pulse sound
      }
    }

    // Check hit target
    function checkHit() {
      let dx = playerX - targetX;
      let dy = playerY - targetY;
      if (Math.hypot(dx, dy) < 10) {
        score++;
        scoreEl.textContent = score;
        playTone(587.33, 0.25); // Chime sound (D5)
        
        // Move target randomly
        targetX = 20 + Math.random() * 60;
        targetY = 20 + Math.random() * 60;
        target.style.left = targetX + "%";
        target.style.top = targetY + "%";
      }
    }

    // Request iOS/Android Motion Permissions & Unlock Audio
    async function startApp() {
      initAudio();
      playTone(440, 0.2); // Test chime

      // Request Permission for iOS 13+ devices
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          const resp = await DeviceOrientationEvent.requestPermission();
          if (resp === "granted") {
            window.addEventListener("deviceorientation", handleOrientation);
            window.addEventListener("devicemotion", handleMotion);
          } else {
            alert("Motion permission denied.");
          }
        } catch (err) {
          alert("Error requesting motion permission.");
        }
      } else {
        // Android & Non-iOS browsers
        window.addEventListener("deviceorientation", handleOrientation);
        window.addEventListener("devicemotion", handleMotion);
      }

      document.getElementById("unlock-overlay").style.display = "none";
    }

    document.getElementById("unlock-btn").addEventListener("click", startApp);
  </script>
</body>
</html>
