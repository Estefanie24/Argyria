<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090817"><title>Argyria · Games</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--gold:#ead49a;--cyan:#8ce9e0;--text:#f7f3ff;--muted:#c3bbd5}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:15px 'DM Sans',sans-serif;background:radial-gradient(ellipse at 50% 0%,#49316c88,transparent 55%),linear-gradient(#090817df,#090817f5),url('nebula.webp') center/cover fixed;padding:18px 15px 35px}.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font:600 18px Cinzel,serif;color:var(--gold);letter-spacing:.12em}a{color:var(--cyan)}h1{font:600 clamp(27px,6vw,42px) Cinzel,serif;color:var(--gold);margin:28px 0 8px}.muted{color:var(--muted);line-height:1.6}.panel{margin-top:18px;padding:20px;border:1px solid #cdbb8b66;border-radius:20px;background:#17152bee;box-shadow:0 18px 45px #0005}.btn{border:1px solid #e9d49b88;background:linear-gradient(135deg,#806a42,#4e3c64);color:#fff8e7;padding:11px 16px;border-radius:12px;font-weight:700}.btn.alt{background:#ffffff0d;border-color:#ffffff30}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{cursor:pointer;font:inherit}.big{font:600 clamp(30px,9vw,60px) Cinzel,serif;color:var(--cyan);text-align:center;margin:20px 0}.orb{width:150px;height:150px;border-radius:50%;margin:25px auto;background:radial-gradient(circle at 35% 30%,#fff,#8ce9e0 15%,#8b72e8 45%,#242050 72%);box-shadow:0 0 45px #8ce9e088, inset -15px -18px 30px #05051088;animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 70px #8ce9e0aa}}.tilegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.food,.crystal{border:1px solid #cdbb8b55;background:#24203a;color:white;border-radius:13px;padding:17px;text-align:center;min-height:80px}.food:active,.crystal:active{transform:scale(.97)}.crystal{font-size:28px}.crystal.lit{background:#28535a;border-color:var(--cyan);box-shadow:0 0 24px #8ce9e077}.meter{height:10px;border-radius:99px;background:#39334d;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#75cfc6,#c9a8ff);transition:width .2s}.garden{min-height:180px;border-radius:16px;background:linear-gradient(#0d2130aa,#111b26bb),url('assets/images/Garden/Gemini_Generated_Image_d95wild95wild95w.jpg') center/cover;display:grid;place-items:center;text-align:center;padding:20px}.collection{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 10px;border:1px solid #cdbb8b66;border-radius:10px;background:#24203a;font-size:12px}input,select{background:#0d0b1b;color:white;border:1px solid #cdbb8b66;border-radius:10px;padding:10px}.center{text-align:center}.hidden{display:none!important}footer{margin:22px 0;color:var(--muted);font-size:11px;text-align:center}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">✧ ARGYRIA</div><a href="index.html">← Back to Argyria</a></div><div id="app"></div><footer>Optional wellness activities · Not a medical assessment</footer></main>
<script>
const params=new URLSearchParams(location.search),kind=params.get('game')||'relax',STORE='argyria.v1';function get(){try{return JSON.parse(localStorage.getItem(STORE))||{rewards:[],achievements:[],played:[]}}catch(e){return {rewards:[],achievements:[],played:[]}}}function put(d){localStorage.setItem(STORE,JSON.stringify(d))}function reward(id,label,icon){let d=get();d.rewards=d.rewards||[];if(!d.rewards.some(x=>x.id===id))d.rewards.push({id,label,icon,date:new Date().toISOString().slice(0,10)});d.achievements=d.achievements||[];let a='played-'+kind;if(!d.achievements.some(x=>x.id===a))d.achievements.push({id:a,label:label+' explorer',date:new Date().toISOString().slice(0,10)});d.played=d.played||[];if(!d.played.includes(kind))d.played.push(kind);put(d)}const app=document.getElementById('app');function shell(title,desc,body){app.innerHTML=`<h1>${title}</h1><p class="muted">${desc}</p><section class="panel">${body}</section>`}
if(kind==='relax')relax();else if(kind==='nutrition')nutrition();else if(kind==='crystal')crystal();else if(kind==='garden')garden();else if(kind==='rhythm')rhythm();else shell('Experience not found','Return to Argyria and choose a game.','<a href="index.html">Return home</a>');
function relax(){shell('Relaxation Sanctuary','A gentle visual breathing guide. Follow the orb only if comfortable; you can stop at any time.',`<div class="center"><div class="orb" id="orb"></div><div class="big" id="breathText">Ready?</div><p class="muted" id="breathSub">Choose a comfortable pace. No need to hold your breath.</p><div class="row" style="justify-content:center"><label>Session <select id="duration"><option value="60">1 minute</option><option value="120">2 minutes</option><option value="180">3 minutes</option></select></label><button class="btn" id="start">Begin</button><button class="btn alt" id="stop">Stop</button></div><p id="clock" class="muted">Not started</p><div class="row" style="justify-content:center"><audio id="audio" controls preload="none" style="max-width:100%"><source src="assets/images/Relaxation Sanctuary/Music/Beneath_the_Midnight_Tide.mp3" type="audio/mpeg"></audio></div></div>`);let timer=null,elapsed=0,total=60,phase=0;const text=document.getElementById('breathText'),sub=document.getElementById('breathSub');document.getElementById('start').onclick=()=>{if(timer)return;total=+document.getElementById('duration').value;elapsed=0;tick();timer=setInterval(tick,1000)};document.getElementById('stop').onclick=()=>{clearInterval(timer);timer=null;text.textContent='Paused';sub.textContent='You can return whenever you wish.';document.getElementById('clock').textContent='Session stopped.'};function tick(){if(elapsed>=total){clearInterval(timer);timer=null;text.textContent='Complete';sub.textContent='Thank you for taking a quiet moment.';document.getElementById('clock').textContent='Session completed';reward('breath-'+Date.now(),'Sanctuary star','✦');return}let p=elapsed%8;text.textContent=p<4?'Breathe in':'Breathe out';sub.textContent=p<4?'Gently and comfortably':'Slowly release your breath';document.getElementById('clock').textContent=`${Math.floor((total-elapsed)/60)}:${String((total-elapsed)%60).padStart(2,'0')} remaining`;elapsed++}}
function nutrition(){let qs=[{q:'Which food is commonly a source of dietary fiber?',o:['Beans','Olive oil','Chicken breast','Water'],a:0,why:'Beans and other legumes provide dietary fiber.'},{q:'Which nutrient is the body’s main readily available energy source?',o:['Carbohydrate','Vitamin C','Calcium','Water'],a:0,why:'Carbohydrates are a major energy source; foods also provide other important nutrients.'},{q:'Which food is a source of unsaturated fat?',o:['Avocado','Candy','Soft drink','Plain rice'],a:0,why:'Avocado contains mostly monounsaturated fat.'},{q:'Which mineral is important for normal bone structure?',o:['Calcium','Sodium only','Caffeine','Alcohol'],a:0,why:'Calcium is an important component of bones and teeth.'}];let i=0,score=0;shell('Nutrition Quest','Explore everyday nutrition concepts. This is general education, not individualized dietary advice.',`<div class="status" id="qnum">QUESTION 1 OF ${qs.length}</div><h2 id="question"></h2><div id="answers" class="tilegrid"></div><p id="feedback" class="muted"></p><div class="row"><button class="btn" id="next" disabled>Next question →</button></div>`);function show(){document.getElementById('qnum').textContent=`QUESTION ${i+1} OF ${qs.length}`;document.getElementById('question').textContent=qs[i].q;document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;document.getElementById('answers').innerHTML=qs[i].o.map((x,n)=>`<button class="food" data-n="${n}">${x}</button>`).join('');document.querySelectorAll('.food').forEach(b=>b.onclick=()=>{if(document.getElementById('next').dataset.done)return;let correct=+b.dataset.n===qs[i].a;if(correct)score++;document.getElementById('feedback').textContent=(correct?'Correct. ':'Good try. ')+qs[i].why;document.getElementById('next').disabled=false;document.getElementById('next').dataset.done='1';document.querySelectorAll('.food').forEach(x=>x.disabled=true)})}document.getElementById('next').onclick=()=>{if(++i>=qs.length){document.querySelector('.panel').innerHTML=`<div class="center"><div class="big">${score}/${qs.length}</div><h2>Quest complete!</h2><p class="muted">You explored four nutrition concepts.</p><button class="btn" onclick="location.href='index.html'">Return to Argyria</button></div>`;reward('nutrition-'+Date.now(),'Nutrition explorer','🍎')}else{document.getElementById('next').dataset.done='';show()}};show()}
function crystal(){let seq=[],input=[],round=1,playing=false;const symbols=['◆','✦','❖','✧'];shell('Crystal Focus','Watch the crystal sequence, then repeat it. Take breaks whenever you wish.',`<div class="center"><div class="big" id="round">Round 1</div><p class="muted" id="hint">Press Start to watch the sequence.</p><div class="tilegrid" id="crystals">${symbols.map((s,i)=>`<button class="crystal" data-i="${i}">${s}</button>`).join('')}</div><p id="score" class="muted">Sequences completed: 0</p><button class="btn" id="start">Start sequence</button></div>`);let score=0;const buttons=[...document.querySelectorAll('.crystal')];function flash(i){buttons[i].classList.add('lit');setTimeout(()=>buttons[i].classList.remove('lit'),450)}async function play(){playing=true;document.getElementById('hint').textContent='Watch carefully…';for(let x of seq){flash(x);await new Promise(r=>setTimeout(r,700))}playing=false;document.getElementById('hint').textContent='Your turn: repeat the sequence.'}document.getElementById('start').onclick=()=>{seq.push(Math.floor(Math.random()*4));input=[];document.getElementById('round').textContent='Round '+seq.length;play()};buttons.forEach((b)=>b.onclick=()=>{if(playing||!seq.length)return;let n=+b.dataset.i;flash(n);input.push(n);if(input[input.length-1]!==seq[input.length-1]){document.getElementById('hint').textContent=`Sequence ended. You completed ${score} rounds. Try again when ready.`;seq=[];document.getElementById('start').textContent='Try again';return}if(input.length===seq.length){score++;document.getElementById('score').textContent='Sequences completed: '+score;document.getElementById('hint').textContent='Well done! Ready for the next pattern?';if(score>=3){reward('crystal-'+Date.now(),'Crystal focus gem','💎');document.getElementById('hint').textContent='Three sequences completed — reward unlocked!'}document.getElementById('start').textContent='Next sequence'}})}
function garden(){let d=get(),coll=d.rewards||[];shell('Garden of Vitality','Your garden grows through optional actions. Missed days never remove what you have unlocked.',`<div class="garden"><div><div class="big">❄️ ✿ ❄️</div><h2>Your crystal garden</h2><p class="muted">A growing collection of virtual keepsakes.</p></div></div><h3>Garden collection</h3><div class="collection" id="gardenItems"></div><p class="muted">Record real-world actions in Wellness. These virtual objects are rewards only.</p><div class="row"><a class="btn" href="index.html#wellness">Record water, sleep or steps</a><button class="btn alt" id="ice">Create a garden sparkle</button></div>`);document.getElementById('gardenItems').innerHTML=coll.length?coll.map(x=>`<span class="chip">${x.icon} ${x.label}</span>`).join(''):'<span class="muted">Your first keepsakes will appear here.</span>';document.getElementById('ice').onclick=()=>{reward('garden-spark-'+Date.now(),'Ice Blossom','❄️');document.getElementById('gardenItems').innerHTML=get().rewards.map(x=>`<span class="chip">${x.icon} ${x.label}</span>`).join('')}}
function rhythm(){let hits=0,running=false,start=0,timeout=null;shell('Rhythm of Motion','Tap the beat orb when it appears. Touch controls are always available; movement is optional.',`<div class="center"><div class="big" id="rhythmScore">0</div><p class="muted">Successful taps</p><div class="orb" id="beatOrb" style="cursor:pointer;opacity:.25" role="button" aria-label="Tap the beat"></div><p id="rhythmHint" class="muted">Press Start, then tap the glowing orb as it appears.</p><button class="btn" id="rhythmStart">Start 30-second round</button><p class="muted" id="rhythmTime"></p></div>`);const orb=document.getElementById('beatOrb');document.getElementById('rhythmStart').onclick=()=>{if(running)return;running=true;hits=0;start=Date.now();document.getElementById('rhythmScore').textContent=0;let end=start+30000;function cycle(){if(!running)return;if(Date.now()>=end){running=false;orb.style.opacity='.25';document.getElementById('rhythmHint').textContent=`Round complete. You tapped ${hits} beats.`;reward('rhythm-'+Date.now(),'Rhythm note','🎵');return}orb.style.opacity='1';setTimeout(()=>{orb.style.opacity='.25'},450);document.getElementById('rhythmTime').textContent=Math.ceil((end-Date.now())/1000)+' seconds left';timeout=setTimeout(cycle,900)}cycle()};orb.onclick=()=>{if(!running||orb.style.opacity==='.25')return;hits++;document.getElementById('rhythmScore').textContent=hits;orb.style.transform='scale(.9)';setTimeout(()=>orb.style.transform='',100)};
}
</script></body></html>
