<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argyria | Relaxation Sanctuary</title>
<style>
:root{--ink:#eaf7ff;--muted:#aac5d5;--glass:rgba(9,24,43,.68);--accent:#74e8ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 20%,#254c72,#10223c 40%,#07111f)}
main{max-width:720px;margin:auto;padding:20px 16px 36px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
h1{font-size:clamp(1.5rem,6vw,2.4rem);margin:0}.subtitle,.note,#audioStatus{color:var(--muted);line-height:1.45}
button{border:0;border-radius:16px;padding:13px 17px;font-weight:700;font-size:1rem;color:#07111f;background:linear-gradient(135deg,var(--accent),#d2f8ff)}
button.secondary{background:rgba(255,255,255,.12);color:var(--ink);border:1px solid rgba(255,255,255,.18)}
.card{background:var(--glass);border:1px solid rgba(170,225,255,.18);box-shadow:0 18px 50px rgba(0,0,0,.22);border-radius:26px;padding:22px;margin:15px 0}
.breath-wrap{display:grid;place-items:center;min-height:330px;text-align:center}.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9f5ff 10%,#65d9ff 36%,#7552d7 70%,#24164d);box-shadow:0 0 25px #79e9ff,0 0 75px rgba(113,102,255,.55)}
.orb.breathe{animation:breathe 8s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.78)}50%{transform:scale(1.45)}}
.phase{font-size:1.55rem;font-weight:800;margin-top:36px}.count{font-size:3rem;font-weight:800;color:#aeefff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px;border-radius:18px;background:rgba(255,255,255,.07)}.stat b{display:block;font-size:1.3rem;color:#bff5ff}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body><main>
<header><div><h1>🌙 Relaxation Sanctuary</h1><p class="subtitle">A gentle space for breathing, calm, and mindful pauses.</p></div><button class="secondary" onclick="location.href='../index.html'">← Home</button></header>
<section class="card">
<div class="breath-wrap"><div><div class="orb" id="orb"></div><div class="phase" id="phase">Ready to begin</div><div class="count" id="count">—</div></div></div>
<div class="grid"><div class="stat"><b>Gentle</b>Mindful breathing</div><div class="stat"><b id="cycles">0</b>Breathing cycles</div></div>
<p class="note">This is a wellness and mindfulness activity, not a medical treatment or diagnostic tool.</p>
<div class="controls"><button id="start">Start breathing</button><button class="secondary" id="sound">🔊 Start ambient sound</button><button class="secondary" id="stop" disabled>Stop</button></div>
<p id="audioStatus" aria-live="polite">Tap “Start ambient sound” to enable audio.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let running=false,timer=null,seconds=0,cycle=0,audioCtx=null,master=null,soundTimer=null,soundOn=false;

function setPhase(){const t=seconds%8;if(t<4){$('phase').textContent='Breathe in';$('count').textContent=4-t}else{$('phase').textContent='Breathe out';$('count').textContent=8-t}if(t===0&&seconds>0){cycle++;$('cycles').textContent=cycle}seconds++}
$('start').onclick=()=>{if(running)return;running=true;seconds=0;cycle=0;$('cycles').textContent=0;$('orb').classList.add('breathe');$('start').disabled=true;$('stop').disabled=false;setPhase();timer=setInterval(setPhase,1000)}
$('stop').onclick=()=>{running=false;clearInterval(timer);$('orb').classList.remove('breathe');$('phase').textContent='Session paused';$('count').textContent='—';$('start').disabled=false;$('stop').disabled=true}

function playTone(freq,duration,volume){
  if(!audioCtx||!master)return;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type='sine';osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+.08);
  gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+duration);
  osc.connect(gain).connect(master);osc.start();osc.stop(audioCtx.currentTime+duration+.05);
}
async function startSound(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  master=master||audioCtx.createGain();master.gain.value=.22;master.connect(audioCtx.destination);
  soundOn=true;$('sound').textContent='🔇 Stop ambient sound';$('audioStatus').textContent='Ambient sound is playing.';
  playTone(396,1.8,.22);setTimeout(()=>playTone(528,1.8,.16),900);
  soundTimer=setInterval(()=>{playTone(396,2.2,.13);setTimeout(()=>playTone(528,2,.10),1100)},5000);
 }catch(e){$('audioStatus').textContent='Audio could not start. Check your phone media volume and browser sound settings.'}
}
function stopSound(){soundOn=false;clearInterval(soundTimer);$('sound').textContent='🔊 Start ambient sound';$('audioStatus').textContent='Ambient sound stopped.'}
$('sound').onclick=()=>soundOn?stopSound():startSound();
</script></main></body></html>
