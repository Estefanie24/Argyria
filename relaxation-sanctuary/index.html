<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argyria | Relaxation Sanctuary</title>
<style>
:root{--ink:#eaf7ff;--muted:#b7cbd9;--card:rgba(10,25,48,.78);--accent:#79eaff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);
background:radial-gradient(circle at 50% 12%,#315d84 0,#142944 40%,#07111f 100%)}
main{max-width:720px;margin:auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:clamp(1.6rem,6vw,2.4rem)}.subtitle,.note{color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid rgba(150,225,255,.18);border-radius:26px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
button{border:0;border-radius:16px;padding:13px 17px;font-size:1rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#73e6ff,#d8faff);color:#07111f}
.secondary{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid rgba(255,255,255,.18)}
.center{text-align:center}.orb{width:150px;height:150px;margin:30px auto;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff,#c2f7ff 10%,#66dfff 38%,#7656d7 72%,#27164e);
box-shadow:0 0 30px #75eaff,0 0 80px rgba(113,102,255,.55)}
.breathe{animation:breathe 8s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.78)}50%{transform:scale(1.42)}}
.phase{font-size:1.5rem;font-weight:800}.count{font-size:2.7rem;color:#bdf4ff;font-weight:800;margin:8px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
audio{width:100%;margin-top:18px}#status{color:#bdf4ff;min-height:1.5em}
</style>
</head>
<body>
<main>
<header>
<div><h1>🌙 Relaxation Sanctuary</h1><p class="subtitle">A gentle space for breathing, calm, and mindful pauses.</p></div>
<button class="secondary" id="homeBtn">← Argyria Home</button>
</header>

<section class="card center">
<div class="orb" id="orb"></div>
<div class="phase" id="phase">Ready to begin</div>
<div class="count" id="count">—</div>
<p id="status">Start a breathing session or play the ambient audio.</p>

<div class="controls">
<button id="start">Start breathing</button>
<button class="secondary" id="stop" disabled>Stop</button>
</div>

<audio id="ambient" controls loop preload="auto">
  <source src="audio/ambient-sanctuary.wav" type="audio/wav">
  Your browser does not support audio playback.
</audio>
<p class="note">Use the audio controls above to play or pause the ambient sound. This activity supports mindfulness and relaxation and is not a medical treatment.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let timer=null,seconds=0,running=false;
function update(){
 const t=seconds%8;
 if(t<4){$('phase').textContent='Breathe in';$('count').textContent=4-t;}
 else{$('phase').textContent='Breathe out';$('count').textContent=8-t;}
 seconds++;
}
$('start').onclick=()=>{
 if(running)return;
 running=true;seconds=0;$('orb').classList.add('breathe');
 $('start').disabled=true;$('stop').disabled=false;
 $('status').textContent='Follow the orb at your own comfortable pace.';
 update();timer=setInterval(update,1000);
};
$('stop').onclick=()=>{
 running=false;clearInterval(timer);$('orb').classList.remove('breathe');
 $('phase').textContent='Session paused';$('count').textContent='—';
 $('start').disabled=false;$('stop').disabled=true;
 $('status').textContent='Gentle progress: your mindful pause is complete.';
};
// Explicit repository home URL. If this opens Motion Lab, the repository root index.html
// has been replaced and must be restored separately.
$('homeBtn').onclick=()=>location.href='https://estefanie24.github.io/Argyria/';
</script>
</body>
</html>
